<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide2Anki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400&display=swap">
<style>
  :root {
    --bg: #eef1f3;
    --surface: #ffffff;
    --ink: #1b2430;
    --muted: #5d6a77;
    --line: #d5dce2;
    --accent: #0e7c74;
    --accent-ink: #ffffff;
    --rule: #d9534f;          /* the red line on an index card */
    --ruled: #dbe7f3;         /* its faint blue lines */
    --danger: #b3261e;
    --warn-bg: #fff4d6;
    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181d; --surface: #1d232a; --ink: #e7ebef; --muted: #9aa6b2; --line: #2e3740;
      --accent: #3fb8ad; --accent-ink: #0c1a19; --rule: #e0716d; --ruled: #26313c;
      --danger: #f2877f; --warn-bg: #3a3220; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181d; --surface: #1d232a; --ink: #e7ebef; --muted: #9aa6b2; --line: #2e3740;
    --accent: #3fb8ad; --accent-ink: #0c1a19; --rule: #e0716d; --ruled: #26313c;
    --danger: #f2877f; --warn-bg: #3a3220; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 96px; display: grid; gap: 28px; }
  h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
  h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 800; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .lede { color: var(--muted); margin: 6px 0 0; max-width: 60ch; }
  button, .btn { font: 700 15px var(--body); border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible, .drop:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.link { border: none; background: none; padding: 4px 6px; color: var(--muted); font-weight: 400; }
  button.link:hover { color: var(--danger); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .drop { border: 2px dashed var(--line); border-radius: 14px; background: var(--surface);
    padding: 40px 20px; text-align: center; cursor: pointer; display: grid; gap: 8px; justify-items: center; }
  .drop.over { border-color: var(--accent); }
  .drop strong { font-family: var(--display); font-size: 22px; }
  .drop small { color: var(--muted); }
  .status { display: flex; gap: 12px; align-items: center; color: var(--muted); }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line);
    border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  .error { background: var(--warn-bg); border-radius: 10px; padding: 12px 16px; color: var(--ink); }

  .toolbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line); }
  .summary { font-family: var(--display); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .deckname { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .deckname label { color: var(--muted); font-size: 14px; }
  input[type=text] { font: 15px var(--body); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); min-width: 0; width: 220px; max-width: 100%; }

  .slide { display: grid; gap: 12px; }
  .slide-head { display: flex; align-items: baseline; gap: 12px; }
  .slide-head h2 { font-size: 20px; }
  .slide-head .tag { font: 12px var(--mono); color: var(--muted); }
  .slide-head button { margin-left: auto; }

  /* Each card looks like a ruled index card: red top rule, faint blue lines. */
  .card { background: var(--surface); border-radius: 6px; border: 1px solid var(--line);
    border-top: 3px solid var(--rule); padding: 14px 16px; display: grid; gap: 10px;
    grid-template-columns: 1fr 1fr; }
  .card.diagram { border-top-color: var(--accent); }
  .side { display: grid; gap: 6px; align-content: start; }
  .side-label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  textarea { font: 16px/1.6 var(--body); color: var(--ink); width: 100%; resize: vertical; min-height: 64px;
    padding: 6px 8px; border: 1px solid transparent; border-radius: 6px;
    background: repeating-linear-gradient(to bottom, transparent 0, transparent calc(1.6em - 1px), var(--ruled) calc(1.6em - 1px), var(--ruled) 1.6em);
    background-position: 0 6px; }
  textarea:hover { border-color: var(--line); }
  .thumb { max-width: 100%; max-height: 180px; border-radius: 6px; border: 1px solid var(--line); justify-self: start; background: #fff; }
  select { font: 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 6px; max-width: 100%; }
  .card-foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); }
  .pill.diagram { color: var(--accent); }
  .empty { color: var(--muted); font-style: italic; margin: 0; }

  details.removed { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
  details.removed summary { cursor: pointer; font-weight: 700; }
  .removed-row { display: flex; gap: 12px; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .removed-row p { margin: 0; }
  .removed-row small { color: var(--muted); }

  @media (max-width: 640px) { .card { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Slide<span>2</span>Anki</h1>
    <p class="lede">Upload lecture slides. You'll get flashcards in slide order, with diagrams attached, one card per labeled diagram, and repeated facts removed.</p>
  </header>

  <section id="upload">
    <label class="drop" id="drop" tabindex="0">
      <strong>Drop a PDF or PowerPoint here</strong>
      <small>or click to choose a file (.pdf, .pptx)</small>
      <input id="file" type="file" accept=".pdf,.pptx" hidden>
    </label>
  </section>

  <div class="status" id="status" hidden><div class="spinner"></div><span id="status-text">Uploading</span></div>
  <div class="error" id="error" hidden></div>

  <section id="review" hidden>
    <div class="toolbar">
      <div class="summary" id="summary"></div>
      <div class="deckname">
        <label for="deck">Deck name</label>
        <input id="deck" type="text">
        <button class="primary" id="export">Export to Anki</button>
      </div>
    </div>
    <div id="slides" style="display:grid; gap:32px; margin-top:20px"></div>
    <details class="removed" id="removed" style="margin-top:32px" hidden>
      <summary id="removed-title"></summary>
      <div id="removed-list"></div>
    </details>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let job = null;       // server job (slides, figures, deck name)
let cards = [];       // the working, editable list
let removed = [];     // duplicates the server dropped
let nextId = 0;

function showError(msg) { $("error").textContent = msg; $("error").hidden = !msg; }
function setStatus(msg) { $("status").hidden = !msg; $("status-text").textContent = msg || ""; }
const media = (name) => `/api/jobs/${job.id}/media/${encodeURIComponent(name)}`;

// ---------- upload
const drop = $("drop"), fileInput = $("file");
drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } });
fileInput.addEventListener("change", () => fileInput.files[0] && upload(fileInput.files[0]));
["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]));

async function upload(file) {
  showError(""); $("review").hidden = true; setStatus("Uploading " + file.name);
  const body = new FormData(); body.append("file", file);
  try {
    const res = await fetch("/api/jobs", { method: "POST", body });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Upload failed.");
    poll(data.id);
  } catch (e) { setStatus(""); showError(e.message); }
}

async function poll(id) {
  const res = await fetch(`/api/jobs/${id}`);
  const data = await res.json();
  if (!res.ok) { setStatus(""); return showError(data.detail); }
  if (data.status === "running") { setStatus(data.message); return setTimeout(() => poll(id), 1200); }
  setStatus("");
  if (data.status === "error") return showError(data.message);
  job = data;
  cards = data.cards.map((c) => ({ ...c }));
  removed = data.removed.map((c) => ({ ...c }));
  nextId = cards.length + removed.length;
  $("deck").value = data.deck_name;
  render();
}

// ---------- review
function figuresFor(slideNo) {
  const s = job.slides.find((s) => s.number === slideNo);
  return s ? s.figures : [];
}

function imagePicker(card, key) {
  const wrap = document.createElement("div"); wrap.className = "side";
  if (card[key]) { const img = document.createElement("img"); img.className = "thumb"; img.src = media(card[key]); img.alt = ""; wrap.append(img); }
  const options = new Set(figuresFor(card.slide));
  if (card[key]) options.add(card[key]);
  if (!options.size) return wrap;
  const sel = document.createElement("select");
  sel.id = `${card.id}-${key}`;
  sel.setAttribute("aria-label", key === "front_image" ? "Front image" : "Back image");
  sel.append(new Option("No image", ""));
  options.forEach((n) => sel.append(new Option(n.includes("_masked") ? n + " (labels hidden)" : n, n)));
  sel.value = card[key] || "";
  sel.addEventListener("change", () => { card[key] = sel.value || null; render(); });
  wrap.append(sel);
  return wrap;
}

function cardEl(card) {
  const el = document.createElement("article");
  el.className = "card" + (card.type === "diagram" ? " diagram" : "");
  for (const [side, label] of [["front", "Front"], ["back", "Back"]]) {
    const col = document.createElement("div"); col.className = "side";
    const lab = document.createElement("label"); lab.className = "side-label"; lab.textContent = label;
    const ta = document.createElement("textarea");
    ta.id = `${card.id}-${side}`; lab.htmlFor = ta.id;
    ta.value = card[side]; ta.rows = Math.max(2, card[side].split("\n").length);
    ta.addEventListener("input", () => { card[side] = ta.value; });
    col.append(lab, ta, imagePicker(card, side + "_image"));
    el.append(col);
  }
  const foot = document.createElement("div"); foot.className = "card-foot";
  const pill = document.createElement("span");
  pill.className = "pill" + (card.type === "diagram" ? " diagram" : "");
  pill.textContent = card.type === "diagram" ? "Labeled diagram" : "Basic";
  const del = document.createElement("button"); del.className = "link"; del.textContent = "Delete card";
  del.addEventListener("click", () => { cards = cards.filter((c) => c !== card); render(); });
  foot.append(pill, del);
  el.append(foot);
  return el;
}

function render() {
  $("review").hidden = false;
  const slug = $("deck").value.replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "") || "Deck";
  const withCards = new Set(cards.map((c) => c.slide));
  $("summary").textContent =
    `${cards.length} card${cards.length === 1 ? "" : "s"} from ${job.slide_count} slides, ` +
    `${removed.length} duplicate${removed.length === 1 ? "" : "s"} removed`;
  $("export").disabled = cards.length === 0;

  const host = $("slides"); host.replaceChildren();
  for (const slide of job.slides) {
    const mine = cards.filter((c) => c.slide === slide.number).sort((a, b) => a.order - b.order);
    const sec = document.createElement("section"); sec.className = "slide";
    const head = document.createElement("div"); head.className = "slide-head";
    const h = document.createElement("h2"); h.textContent = `Slide ${slide.number}`;
    const tag = document.createElement("span"); tag.className = "tag";
    tag.textContent = `${slug}::Slide_${String(slide.number).padStart(2, "0")}`;
    const add = document.createElement("button"); add.textContent = "Add card";
    add.addEventListener("click", () => {
      const last = Math.max(-1, ...cards.map((c) => c.order));
      cards.push({ id: "n" + nextId++, slide: slide.number, front: "", back: "", type: "basic",
                   front_image: null, back_image: null, order: last + 1 });
      render();
      const t = document.getElementById(`n${nextId - 1}-front`); if (t) t.focus();
    });
    head.append(h, tag, add);
    sec.append(head);
    if (mine.length) mine.forEach((c) => sec.append(cardEl(c)));
    else { const p = document.createElement("p"); p.className = "empty"; p.textContent = "No cards from this slide."; sec.append(p); }
    host.append(sec);
  }

  $("removed").hidden = removed.length === 0;
  $("removed-title").textContent = `${removed.length} duplicate${removed.length === 1 ? "" : "s"} removed. Review or restore`;
  const list = $("removed-list"); list.replaceChildren();
  for (const r of removed) {
    const row = document.createElement("div"); row.className = "removed-row";
    const p = document.createElement("p");
    const orig = cards.find((c) => c.id === r.duplicate_of);
    p.textContent = r.front;
    const small = document.createElement("small");
    small.textContent = ` Slide ${r.slide}` + (orig ? `, repeats a card on slide ${orig.slide}` : "");
    p.append(small);
    const btn = document.createElement("button"); btn.textContent = "Restore";
    btn.addEventListener("click", () => { removed = removed.filter((x) => x !== r); cards.push(r); render(); });
    row.append(p, btn); list.append(row);
  }
}
$("deck").addEventListener("input", () => render());

// ---------- export
$("export").addEventListener("click", async () => {
  const btn = $("export"); btn.disabled = true; btn.textContent = "Building deck…"; showError("");
  const deckName = $("deck").value.trim() || job.deck_name;
  const payload = cards
    .filter((c) => c.front.trim() && c.back.trim())
    .map(({ slide, front, back, type, front_image, back_image, order }) => ({ slide, front, back, type, front_image, back_image, order }));
  try {
    const res = await fetch(`/api/jobs/${job.id}/export`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ deck_name: deckName, cards: payload }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || "Export failed.");
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = deckName.replace(/[^A-Za-z0-9]+/g, "_") + ".apkg";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { showError(e.message); }
  btn.disabled = false; btn.textContent = "Export to Anki";
});
</script>
</body>
</html>
